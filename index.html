<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Kivo</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">

    <!-- TOP BAR -->

    <header class="topbar">

        <button
            id="menuButton"
            class="icon-button"
            aria-label="Open menu"
        >
            ☰
        </button>


        <div class="logo">
            Kivo
        </div>


        <button
            id="newChatButton"
            class="icon-button"
            aria-label="New chat"
        >
            ＋
        </button>

    </header>


    <!-- CHAT -->

    <main
        id="chat"
        class="chat"
    >

        <div
            id="welcome"
            class="welcome"
        >

            <div class="kivo-icon">
                K
            </div>

            <h1>
                How can I help you?
            </h1>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <textarea
    id="messageInput"
    placeholder="Ask Anything..."
    rows="1"
    autocomplete="off"
    autocorrect="on"
    autocapitalize="sentences"
    spellcheck="true"
    inputmode="text"
></textarea>


            <button
                id="sendButton"
                class="send-button"
                aria-label="Send"
            >
                ↑
            </button>

        </div>

    </div>

</div>


<!-- SIDEBAR OVERLAY -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay"
></div>


<!-- SIDEBAR -->

<aside
    id="sidebar"
    class="sidebar"
>

    <div class="sidebar-header">

        <strong>
            Kivo
        </strong>


        <button
            id="closeSidebar"
            class="icon-button"
            aria-label="Close menu"
        >
            ×
        </button>

    </div>


    <button
        id="sidebarNewChat"
        class="new-chat-button"
    >
        ＋ New Chat
    </button>


    


    <div
        id="conversationList"
        class="conversation-list"
    ></div>


    <button
        id="donateButton"
        class="donate-button"
        type="button"
    >
        ❤️ Donate
    </button>

</aside>


<!-- DONATION MODAL -->

<div
    id="donationModal"
    class="donation-modal"
    aria-hidden="true"
>

    <div
        class="donation-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="donationTitle"
    >

        <div class="donation-modal-header">

            <h2 id="donationTitle">
                ❤️ Support Kivo
            </h2>

            <button
                id="closeDonationButton"
                class="icon-button"
                type="button"
                aria-label="Close donation"
            >
                ×
            </button>

        </div>


        <p class="donation-network">
            USDT • TRC20
        </p>


        <label
            class="donation-label"
            for="donationAmount"
        >
            Donation amount
        </label>

        <input
            id="donationAmount"
            class="donation-input"
            type="text"
            inputmode="decimal"
            placeholder="Enter amount"
            autocomplete="off"
        >


        <div class="donation-address-section">

            <span class="donation-label">
                Receiving address
            </span>

            <div class="donation-address-row">

                <code id="donationAddress">
                    Wallet address will appear here
                </code>

                <button
                    id="copyDonationAddress"
                    class="donation-copy-button"
                    type="button"
                >
                    Copy
                </button>

            </div>

        </div>


        <button
            id="donationContinueButton"
            class="donation-continue-button"
            type="button"
        >
            Continue
        </button>


        <p
            id="donationStatus"
            class="donation-status"
            aria-live="polite"
        ></p>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
